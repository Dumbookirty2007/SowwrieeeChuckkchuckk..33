<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .emoji-top {
            font-size: clamp(2.5em, 8vw, 4em);
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .emoji-middle {
            font-size: clamp(2em, 6vw, 3.5em);
            margin: 15px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .emoji-bottom {
            font-size: clamp(2em, 6vw, 3.5em);
            margin-top: 15px;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .heading {
            font-size: clamp(2em, 7vw, 3.5em);
            color: white;
            font-weight: bold;
            margin: 20px 0 15px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .subheading {
            font-size: clamp(1em, 4vw, 1.5em);
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 500;
        }

        .button {
            display: inline-block;
            padding: 15px 35px;
            margin-top: 25px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: clamp(0.95em, 3vw, 1.2em);
            font-weight: 700;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }

        .button:hover,
        .button:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }

        .button:active {
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .emoji-top {
                margin-bottom: 15px;
            }

            .heading {
                margin: 15px 0 10px 0;
            }

            .subheading {
                margin-bottom: 20px;
                font-size: 1.1em;
            }

            .button {
                padding: 12px 28px;
                margin-top: 20px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                min-height: 100vh;
            }

            .container {
                padding: 25px 18px;
                border-radius: 15px;
            }

            .emoji-top {
                font-size: 2.5em;
                margin-bottom: 12px;
            }

            .emoji-middle {
                font-size: 2em;
                margin: 10px 0;
            }

            .emoji-bottom {
                font-size: 2em;
                margin-top: 10px;
            }

            .heading {
                font-size: 1.8em;
                margin: 12px 0 8px 0;
            }

            .subheading {
                font-size: 0.95em;
                margin-bottom: 15px;
                line-height: 1.4;
            }

            .button {
                padding: 11px 24px;
                margin-top: 15px;
                font-size: 0.9em;
                letter-spacing: 0.5px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            .container {
                padding: 15px 20px;
            }

            .heading {
                margin: 8px 0 5px 0;
                font-size: 1.8em;
            }

            .subheading {
                margin-bottom: 10px;
                font-size: 0.9em;
            }

            .button {
                margin-top: 10px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-top">🌸</div>
        <div class="emoji-middle">💕</div>
        <div class="emoji-middle">✨</div>
        
        <div class="heading">I'm Sorry</div>
        
        <div class="subheading">
            hey dumboo 🥺<br><br>
            I need to tell you something...
        </div>

        <a href="page2.html" class="button">Let me explain 💝</a>

        <div class="emoji-bottom">😸</div>
    </div>
</body>
</html>
